<!doctype html>
<html>
  <head>
    <style>
      p {
        text-align: center;
        color: red;
      }
      #para1 {
        text-align: center;
        color: red;
      }

      * {
        text-align: center;
        color: blue;
      }

      h1 {
        text-align: center;
        color: red;
      }

      h2 {
        text-align: center;
        color: red;
      }

      h1,
      h2,
      p {
        text-align: center;
        color: red;
      }
    </style>
    <!--El * sirve para apliarlo a todo-->
  </head>
  <body>
    <h1>HOLA</h1>
    <p>Every paragraph will be affected by the style.</p>
    <p id="para1">Me too!</p>
    <p>And me!</p>

    <p id="para1">Hello World!</p>
    <p>This paragraph is not affected by the style.</p>
  </body>
</html>
