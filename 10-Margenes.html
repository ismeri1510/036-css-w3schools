<!doctype html>
<html>
  <head>
    <style>
      div {
        border: 1px solid black;
        margin-top: 100px;
        margin-bottom: 100px;
        margin-right: 150px;
        margin-left: 100px;
        /* margin: auto; se puede automatico */

        background-color: lightblue;
        /* margin: 25px 50px 75px 100px; para en una linea meter los 4 margenes*/
      }
      p.ex1 {
        margin-left: inherit;
      }
      h1 {
        margin-bottom: 50px;
      }

      h2 {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Margin Collapse</h1>
    <h2>Heading 2</h2>
    <h2>Using individual margin properties</h2>

    <div>
      This div element has a top margin of 100px, a right margin of 150px, a
      bottom margin of 100px, and a left margin of 80px.
    </div>

    <div>
      <p class="ex1">
        This paragraph has an inherited left margin (from the div element).
      </p>
    </div>
  </body>
</html>
