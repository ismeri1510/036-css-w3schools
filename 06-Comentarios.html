<!doctype html>
<html>
  <head>
    <style>
      /* This is a single-line comment */
      p {
        color: red;
      }
      p {
        color: red; /* Agregar comentarios donde sea */
      }
      p {
        color: /*red*/ blue;
      }
      /* This is
a multi-line
comment */
    </style>
  </head>
  <body>
    <p>Hello World!</p>
    <p>This paragraph is styled with CSS.</p>
    <p>CSS comments are not shown in the output.</p>
  </body>
</html>
